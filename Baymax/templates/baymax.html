{% extends 'base.html' %}
{% load static %}
{% block title %}Baymax{% endblock %}
{% block content %}
<div class='chat-container' style='justify-content:center;align-items:center;text-align:center;padding:40px 20px;'>
    <div style='font-size:56px;font-weight:700;color:#2d2d2d;margin-bottom:10px;'>Baymax</div>
    <div style='font-size:18px;color:#6e707e;margin-bottom:30px;'>What can I assist you with?</div>
    <a href='{% url 'upload' %}' class='btn btn-primary' style='padding:14px 36px;font-size:18px;border-radius:50px;text-decoration:none;'>Get Started</a>
    <div class='row mt-5 text-center'>
        <div class='col-md-4 mb-3'>
            <div class='p-3'><i class='fas fa-upload fa-2x text-primary mb-2'></i><h6>Upload</h6><p class='text-muted small'>CSV or Excel data</p></div>
        </div>
        <div class='col-md-4 mb-3'>
            <div class='p-3'><i class='fas fa-comments fa-2x text-primary mb-2'></i><h6>Ask</h6><p class='text-muted small'>Questions in plain English</p></div>
        </div>
        <div class='col-md-4 mb-3'>
            <div class='p-3'><i class='fas fa-chart-bar fa-2x text-primary mb-2'></i><h6>Visualize</h6><p class='text-muted small'>Interactive charts</p></div>
        </div>
    </div>
    <div style='position:relative;width:160px;height:160px;margin:40px auto 0;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;overflow:hidden;'>
        <img src='{% static "baymax.png" %}' alt='Baymax' style='width:100%;height:100%;object-fit:cover;border-radius:50%;'>
        <div style='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:40px;'>
            <div style='position:relative;width:100%;height:100%;'>
                <div style='position:absolute;left:8px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#2d2d2d;border-radius:50%;'></div>
                <div style='position:absolute;right:8px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#2d2d2d;border-radius:50%;'></div>
                <div style='position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:#2d2d2d;border-radius:1px;'></div>
            </div>
        </div>
    </div>
    <footer class='mt-5 text-muted small'>Powered by OpenRouter</footer>
</div>
{% endblock %}
