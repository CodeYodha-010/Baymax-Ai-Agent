{% load static %}
<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>
    <title>{% block title %}Baymax{% endblock %}</title>
    <meta name='description' content='Baymax - AI-powered data analysis. Upload CSV/Excel, ask questions in plain English, get instant charts and insights.'>
    <meta property='og:title' content='Baymax - AI Data Analysis'>
    <meta property='og:description' content='Upload CSV or Excel files and ask questions in plain English. Get instant charts, tables, and insights — no SQL required.'>
    <meta property='og:type' content='website'>
    <meta name='twitter:card' content='summary_large_image'>
    <meta name='twitter:title' content='Baymax - AI Data Analysis'>
    <meta name='twitter:description' content='Upload CSV or Excel files and ask questions in plain English. Get instant charts and insights.'>
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap' rel='stylesheet'>
    <link rel='icon' href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>'>
    {% block extra_head %}{% endblock %}
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'>
    <script src='https://code.highcharts.com/highcharts.js'></script>
    <script src='https://code.highcharts.com/highcharts-more.js'></script>
    <script src='https://code.highcharts.com/modules/heatmap.js'></script>
    <script src='https://code.highcharts.com/modules/candlestick.js'></script>
    <script src='https://code.highcharts.com/modules/exporting.js'></script>
    <link href='{% static "style.css" %}' rel='stylesheet'>
    <script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js'></script>
</head>
<body>
    {% block content %}{% endblock %}
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script>
    <script src='{% static "charts.js" %}'></script>
    {% block scripts %}{% endblock %}
</body>
</html>
